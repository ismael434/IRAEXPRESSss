<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord — IRA EXPRESS</title>
    <link rel="icon" href="/assets/images/logo.jpg">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body data-sidebar="merchant" data-page="dashboard">
    <div class="mise-en-page-tableau">
        <div id="barre-laterale-inclusion"></div>

        <main class="contenu-principal">
            <div class="entete-page">
                <div>
                    <h1 id="nom-boutique">Chargement…</h1>
                    <p id="message-bienvenue"></p>
                </div>
                <a href="/merchant/ajouter_produit.html" class="btn btn-principal">+ Ajouter un produit</a>
            </div>

            <div class="grille-stats">
                <div class="carte-stat"><span>Produits en ligne</span><strong id="stat-produits">—</strong></div>
                <div class="carte-stat"><span>Commandes en attente</span><strong id="stat-attente">—</strong></div>
                <div class="carte-stat"><span>Total des ventes livrées</span><strong id="stat-ventes">—</strong></div>
            </div>

            <div class="tableau-conteneur">
                <table>
                    <thead>
                        <tr>
                            <th>N°</th>
                            <th>Client</th>
                            <th>Quartier</th>
                            <th>Montant</th>
                            <th>Statut</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="corps-tableau-commandes">
                        <tr>
                            <td colspan="6" style="color:var(--texte-att)">Chargement…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/pages/merchant.js"></script>
</body>

</html>
