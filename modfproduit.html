<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titre-page">Modifier le produit — IRA EXPRESS</title>
    <link rel="icon" href="/assets/images/logo.jpg">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body data-sidebar="merchant" data-page="produits">
    <div class="mise-en-page-tableau">
        <div id="barre-laterale-inclusion"></div>

        <main class="contenu-principal">
            <div class="entete-page">
                <div>
                    <h1 id="titre-h1">Modifier le produit</h1>
                    <p>Mettez à jour le prix, le stock ou la disponibilité de ce produit.</p>
                </div>
            </div>

            <div class="carte-form" style="max-width:560px">
                <div id="zone-message"></div>

                <form id="form-modifier-produit">
                    <input type="hidden" id="produit_id">
                    <div class="champ">
                        <label for="nom">Nom du produit</label>
                        <input type="text" id="nom" required>
                    </div>
                    <div class="champ">
                        <label for="categorie_id">Catégorie</label>
                        <select id="categorie_id" required></select>
                    </div>
                    <div class="champ">
                        <label for="description">Description</label>
                        <textarea id="description"></textarea>
                    </div>
                    <div class="champ">
                        <label for="prix">Prix (FCFA)</label>
                        <input type="number" id="prix" min="1" step="1" required>
                    </div>
                    <div class="champ">
                        <label for="stock">Quantité en stock</label>
                        <div style="display:flex;align-items:center;gap:10px">
                            <button type="button" class="btn btn-secondaire btn-petit" id="btn-stock-moins">−</button>
                            <input type="number" id="stock" min="0" step="1" required style="text-align:center">
                            <button type="button" class="btn btn-secondaire btn-petit" id="btn-stock-plus">+</button>
                        </div>
                    </div>
                    <div class="champ">
                        <label for="statut">Disponibilité</label>
                        <select id="statut">
                            <option value="disponible">Disponible</option>
                            <option value="rupture">Rupture de stock</option>
                            <option value="desactive">Désactivé</option>
                        </select>
                    </div>
                    <div class="champ">
                        <label for="photo">Remplacer la photo</label>
                        <input type="file" id="photo" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-principal btn-pleine-largeur btn-large">Enregistrer les
                        modifications</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/pages/merchant.js"></script>
</body>

</html>
