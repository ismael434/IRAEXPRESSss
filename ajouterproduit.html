<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un produit — IRA EXPRESS</title>
    <link rel="icon" href="/assets/images/logo.jpg">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body data-sidebar="merchant" data-page="ajouter">
    <div class="mise-en-page-tableau">
        <div id="barre-laterale-inclusion"></div>

        <main class="contenu-principal">
            <div class="entete-page">
                <div>
                    <h1>Ajouter un produit</h1>
                    <p>Renseignez les informations de votre nouvel article.</p>
                </div>
            </div>

            <div class="carte-form" style="max-width:560px">
                <div id="zone-message"></div>

                <form id="form-ajouter-produit">
                    <div class="champ">
                        <label for="nom">Nom du produit</label>
                        <input type="text" id="nom" required>
                    </div>
                    <div class="champ">
                        <label for="categorie_id">Catégorie</label>
                        <select id="categorie_id" required>
                            <option value="">Choisir une catégorie</option>
                        </select>
                    </div>
                    <div class="champ">
                        <label for="description">Description</label>
                        <textarea id="description"></textarea>
                    </div>
                    <div class="champ">
                        <label for="prix">Prix (FCFA)</label>
                        <input type="number" id="prix" min="1" step="1" required>
                    </div>
                    <div class="champ">
                        <label for="stock">Quantité en stock</label>
                        <input type="number" id="stock" min="0" step="1" value="1" required>
                    </div>
                    <div class="champ">
                        <label for="photo">Photo du produit</label>
                        <input type="file" id="photo" accept="image/*">
                    </div>
                    <button type="submit" class="btn btn-principal btn-pleine-largeur btn-large">Publier le
                        produit</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/cart.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/pages/merchant.js"></script>
</body>

</html>
